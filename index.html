<h1>Jarvis</h1>
<p>Jarvis ist ein privater Assistent für den eigenen Windows-PC einer einzelnen Person. Er zeigt ihr morgens im eigenen Terminal ihre Termine von heute und morgen sowie Absender und Betreff ihrer ungelesenen Mails an. Die Anwendung ist nicht öffentlich nutzbar.</p>
